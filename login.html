<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<title>Register - HS Design Quotation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Inter",-apple-system,"SF Pro Text",sans-serif;background:#f5f5f7;color:#1d1d1f;display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.auth-container{width:100%;max-width:400px;padding:24px;animation:fadeUp .6s ease-out}
.logo{text-align:center;margin-bottom:32px}
.logo a{font-size:20px;font-weight:700;letter-spacing:-.3px;color:#1d1d1f;text-decoration:none}
.logo span{color:#0071e3}
.logo .sub{font-size:13px;color:#86868b;margin-top:4px}
.card{background:#fff;border-radius:20px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,.04);border:1px solid #f0f0f0}
.card h1{font-size:22px;font-weight:700;margin-bottom:4px}
.card .subtitle{font-size:14px;color:#86868b;margin-bottom:24px}
.tabs{display:flex;gap:0;margin-bottom:24px;background:#f5f5f7;border-radius:10px;padding:3px}
.tab{flex:1;text-align:center;padding:8px 0;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;transition:all .3s;color:#86868b;border:none;background:transparent}
.tab.active{background:#fff;color:#1d1d1f;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#86868b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:12px 14px;border:1px solid #e8e8ed;border-radius:10px;font-size:14px;font-family:"Inter",sans-serif;transition:border-color .2s;background:#fff;outline:none}
.form-group input:focus{border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.1)}
.form-group .hint{font-size:11px;color:#aeaeb2;margin-top:4px}
.btn-primary{width:100%;padding:13px;border-radius:980px;border:none;background:#0071e3;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .3s;font-family:"Inter",sans-serif}
.btn-primary:hover{background:#0077ed;transform:scale(1.01)}
.btn-primary.loading{opacity:.7;pointer-events:none}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#aeaeb2;font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e8e8ed}
.btn-google{width:100%;padding:12px;border-radius:980px;border:1px solid #e8e8ed;background:#fff;color:#1d1d1f;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:"Inter",sans-serif;text-decoration:none}
.btn-google:hover{border-color:#0071e3;background:#f5f5f7}
.btn-google img{width:18px;height:18px}
.error{color:#ff3b30;font-size:12px;margin-top:6px;display:none}
.success{color:#34c759;font-size:12px;margin-top:6px;display:none}
.footer{text-align:center;margin-top:24px;font-size:13px;color:#86868b}
.footer a{color:#0071e3;text-decoration:none}
.footer a:hover{text-decoration:underline}
.password-hint{font-size:11px;color:#aeaeb2;margin-top:4px}
.form-group .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#86868b;cursor:pointer;font-size:13px}
.pw-wrap{position:relative}
@media(max-width:480px){.auth-container{padding:16px}.card{padding:24px;border-radius:16px}}
</style>
</head>
<body>
<div class="auth-container">
  <div class="logo"><a href="/">HS <span>Design</span> Quotation</a><div class="sub">Free quotation tool for Malaysian designers</div></div>
  <div class="card" id="auth-card">
    <h1 id="form-title">Create your account</h1>
    <p class="subtitle" id="form-subtitle">Start creating professional quotations in minutes.</p>
    <div class="tabs" id="auth-tabs"><button class="tab active" onclick="switchTab('register')">Register</button><button class="tab" onclick="switchTab('login')">Sign In</button></div>

    <!-- Register Form -->
    <div id="register-form">
      <div class="form-group"><label>Full Name</label><input type="text" id="reg-name" placeholder="Your name" autocomplete="name"></div>
      <div class="form-group"><label>Email</label><input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="form-group"><label>Password</label><div class="pw-wrap"><input type="password" id="reg-pass" placeholder="Min. 8 characters" autocomplete="new-password"><button class="pw-toggle" onclick="togglePW('reg-pass',this)">Show</button></div><div class="password-hint">At least 8 characters, 1 uppercase letter, 1 special character</div></div>
      <div class="form-group"><label>Referral Code (optional)</label><input type="text" id="reg-ref" placeholder="Enter code"></div>
      <div id="reg-error" class="error"></div>
      <div id="reg-success" class="success"></div>
      <button class="btn-primary" onclick="handleRegister()" id="reg-btn">Create Account</button>
      <div class="divider">or</div>
      <a class="btn-google" href="/auth/google"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.95 1 11.02 1 13s.43 4.05 1.18 5.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Continue with Google</a>
    </div>

    <!-- Login Form -->
    <div id="login-form" style="display:none">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="form-group"><label>Password</label><div class="pw-wrap"><input type="password" id="login-pass" placeholder="Enter password" autocomplete="current-password"><button class="pw-toggle" onclick="togglePW('login-pass',this)">Show</button></div></div>
      <div id="login-error" class="error"></div>
      <button class="btn-primary" onclick="handleLogin()" id="login-btn">Sign In</button>
      <div class="divider">or</div>
      <a class="btn-google" href="/auth/google"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.95 1 11.02 1 13s.43 4.05 1.18 5.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Continue with Google</a>
    </div>
  </div>
  <div class="footer"><a href="/">Back to Home</a> &middot; <a href="/pricing">Pricing</a></div>
</div>

<script>
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(tab==='register'){
    document.querySelector('.tab:first-child').classList.add('active');
    document.getElementById('register-form').style.display='block';
    document.getElementById('login-form').style.display='none';
    document.getElementById('form-title').textContent='Create your account';
    document.getElementById('form-subtitle').textContent='Start creating professional quotations in minutes.';
  } else {
    document.querySelector('.tab:last-child').classList.add('active');
    document.getElementById('register-form').style.display='none';
    document.getElementById('login-form').style.display='block';
    document.getElementById('form-title').textContent='Welcome back';
    document.getElementById('form-subtitle').textContent='Sign in to your account.';
  }
}
function togglePW(id,btn){
  var inp=document.getElementById(id);
  if(inp.type==='password'){inp.type='text';btn.textContent='Hide'}else{inp.type='password';btn.textContent='Show'}
}
function showError(id,msg){
  var el=document.getElementById(id);
  el.textContent=msg;el.style.display='block';
  setTimeout(function(){el.style.display='none'},4000);
}
async function handleRegister(){
  var btn=document.getElementById('reg-btn');
  var email=document.getElementById('reg-email').value.trim();
  var pass=document.getElementById('reg-pass').value;
  var name=document.getElementById('reg-name').value.trim();
  var ref=document.getElementById('reg-ref').value.trim();
  if(!email||!pass||!name){showError('reg-error','Please fill in all required fields.');return;}
  btn.classList.add('loading');btn.textContent='Creating account...';
  try{
    var r=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass,name,referral_code:ref||undefined})});
    var d=await r.json();
    if(d.success&&d.token){
      localStorage.setItem('token',d.token);localStorage.setItem('qs_token',d.token);
      window.location.href='/dashboard';
    } else {
      btn.classList.remove('loading');btn.textContent='Create Account';
      showError('reg-error',d.error||'Registration failed');
    }
  }catch(e){btn.classList.remove('loading');btn.textContent='Create Account';showError('reg-error','Network error');}
}
async function handleLogin(){
  var btn=document.getElementById('login-btn');
  var email=document.getElementById('login-email').value.trim();
  var pass=document.getElementById('login-pass').value;
  if(!email||!pass){showError('login-error','Please enter email and password.');return;}
  btn.classList.add('loading');btn.textContent='Signing in...';
  try{
    var r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    var d=await r.json();
    if(d.success&&d.token){
      localStorage.setItem('token',d.token);localStorage.setItem('qs_token',d.token);
      window.location.href='/dashboard';
    } else {
      btn.classList.remove('loading');btn.textContent='Sign In';
      showError('login-error',d.error||'Login failed');
    }
  }catch(e){btn.classList.remove('loading');btn.textContent='Sign In';showError('login-error','Network error');}
}
</script>
</body>
</html>
